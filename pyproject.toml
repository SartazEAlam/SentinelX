[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelx"
version = "0.1.0"
description = "SentinelX: Intelligent Data Loss Prevention and Exfiltration Detection System"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"

[project.optional-dependencies]
backend = [
    "fastapi>=0.111.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "sqlalchemy>=2.0.30,<3.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",
    "alembic>=1.13.0,<2.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "python-multipart>=0.0.9",
    "psycopg2-binary>=2.9.9",
]

agent = [
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",
    "watchdog>=4.0.0,<5.0.0",
    "psutil>=5.9.0,<6.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

ml = [
    "scikit-learn>=1.5.0,<2.0.0",
    "pandas>=2.2.0,<3.0.0",
    "numpy>=1.26.0,<3.0.0",
    "joblib>=1.4.0,<2.0.0",
]

dev = [
    "pytest>=8.2.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "ruff>=0.4.0,<1.0.0",
    "mypy>=1.10.0,<2.0.0",
]

[tool.setuptools.packages.find]
where = ["backend", "agent"]
exclude = ["tests*", "*tests*"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests", "agent/tests"]
pythonpath = [".", "backend", "agent"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
mypy_path = ["backend", "agent"]
files = ["backend/app", "agent/sentinel_agent"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true


