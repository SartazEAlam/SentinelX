<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Shield Primary Cyan-Blue Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Core 'X' Neon Glow Gradient -->
    <linearGradient id="xGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Tactical Radial Spotlight -->
    <radialGradient id="spotlight" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <!-- Shield Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Container Squircle for High Contrast on Light and Dark Browser Tabs -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Subtle Tactical Spotlight behind the shield -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#spotlight)"/>

  <!-- Outer Cyber Defense Shield -->
  <path d="M32 10 L49 15.5 C49 28.5 42 41 32 49 C22 41 15 28.5 15 15.5 Z" 
        fill="#071224" 
        stroke="url(#shieldGrad)" 
        stroke-width="2.5" 
        stroke-linejoin="round"
        stroke-linecap="round"/>

  <!-- Inner Cyber Contour Accent -->
  <path d="M32 14.5 L45 19 C45 28.5 39.5 37.5 32 43.5 C24.5 37.5 19 28.5 19 19 Z" 
        fill="none" 
        stroke="url(#shieldGrad)" 
        stroke-width="1" 
        stroke-opacity="0.4"
        stroke-linejoin="round"/>

  <!-- Stylized Sentinel 'X' Emblem -->
  <g filter="url(#glow)">
    <!-- Top-Left to Bottom-Right -->
    <path d="M25 24 L39 38" 
          stroke="url(#xGrad)" 
          stroke-width="3" 
          stroke-linecap="round"/>
    <!-- Top-Right to Bottom-Left -->
    <path d="M39 24 L25 38" 
          stroke="url(#xGrad)" 
          stroke-width="3" 
          stroke-linecap="round"/>
    <!-- Central Core Energy Node -->
    <circle cx="32" cy="31" r="2" fill="#ffffff"/>
    <circle cx="32" cy="31" r="3.5" fill="none" stroke="#22d3ee" stroke-width="0.8"/>
  </g>

  <!-- Lower Shield Accent Pulse -->
  <circle cx="32" cy="46" r="1.2" fill="#38bdf8"/>
</svg>