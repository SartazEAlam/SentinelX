version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinelx-db
    environment:
      POSTGRES_DB: sentinelx
      POSTGRES_USER: sentinelx
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelx"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sentinelx-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://sentinelx:changeme@postgres:5432/sentinelx
      JWT_SECRET: ${JWT_SECRET:-CHANGE_ME_BEFORE_PRODUCTION}
      ENVIRONMENT: development
      DEBUG: "true"
      LOG_LEVEL: INFO
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000"
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
